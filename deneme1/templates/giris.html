<!DOCTYPE html>

<html lang="tr" xmlns="http://www.w3.org/1999/xhtml">
<head>
   <meta charset="utf-8">
    <title>Giriş yap - Dijital Sağlık Platformu</title>
   <!__title kodu sayesinde tarayıcıdan açıldığında en üstte bu yazı yazar hocam__>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        <!-- body kısmı sayfanın arka plan rengini ve yazı tipini ayarlıyor hocam-->
        .container {
            max-width: 400px;
            margin: 50px auto;
            background-color: #f5f5f5;
            padding: 20px;
        }
        <!--container kısmı sayfanın ortasında bir kutu oluşturuyor hocam-->
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        <!-- input kısmı kullanıcı adı ve şifre kutularının boyutunu ve görünümünü ayarlıyor hocam-->
        .btn {
            padding: 10px 20px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
             /*btn kısmı giriş yap butonunun boyutunu ve görünümünü ayarlıyor hocam */
    </style>
</head>
<body>
    <div class="container">
        <!--yukarıda ayarlanmış olan kutunun içerisideki herşey bu divin içerisinde olacak hocam-->
        <h2>Giriş Yap</h2>
        <!-- giriş formu başlama -->
        <form method="POST" action="/giris">
        <input type="text" name="username" placeholder="Kullanıcı Adı" required>
        <input type="password" name="password" placeholder="Şifre" required>
        <!-- type pasword olduğu için yazılan şifreyi gizliyor hocam -->
        <button type="submit" class="btn">Giriş Yap</button>
        </form>
        <p><a href="/"> Ana Sayfa Dön</a></p>
        <!-- üstteki kod sayesinde kullanıcılar giriş yapmaktan vazgeçerse ana sayfaya geri dönebileceği bir bağlantı oluşturdum hocam -->

    </div>
</body>
</html>
